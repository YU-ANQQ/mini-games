<title>Roo vs Seal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* Single-look game screen (dusk hard court): colours set explicitly for either host theme */
  :root {
    color-scheme: dark;
    --bg: #14182b;
    --panel: #1d2340;
    --line: #34406e;
    --text: #f3f1ea;
    --dim: #a9b0cf;
    --accent: #f6c453;
    --accent-ink: #2a1c05;
    --fire: #ff6a2a;
    --ice: #7fe0ff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 20px 32px;
  }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
  h1 { font-family: "Bungee", "Noto Sans TC", system-ui, sans-serif; font-weight: 400; font-size: clamp(24px, 5vw, 40px); margin: 0; line-height: 1; letter-spacing: .02em; }
  h1 .roo { color: var(--accent); } h1 .vs { color: var(--dim); font-size: .6em; } h1 .seal { color: var(--ice); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button, .btn { font: inherit; font-size: 14px; color: var(--text); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn { border: 1px solid var(--line); border-radius: 999px; }
  .btn:hover, .seg button:hover { background: var(--line); }
  .seg button[aria-pressed="true"]:hover { background: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden; background: #1b2a55; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; overflow-y: auto; background: rgba(12, 14, 30, .7); text-align: center; padding: 16px; }
  .overlay[hidden] { display: none; }
  .overlay h2 { font-family: "Bungee", "Noto Sans TC", system-ui, sans-serif; font-weight: 400; margin: 0; font-size: clamp(22px, 5vw, 44px); text-wrap: balance; }
  .overlay ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; color: var(--dim); font-size: clamp(12px, 2.2vw, 14px); line-height: 1.5; max-width: 42ch; text-align: left; }
  .quick { color: var(--dim); font-size: 14px; } .quick .touch { display: none; }
  .rules summary { color: var(--dim); font-size: 13px; cursor: pointer; }
  .overlay li b { color: var(--text); font-weight: 700; }
  .overlay p { margin: 0; color: var(--dim); max-width: 38ch; line-height: 1.6; }
  .overlay[data-mode="text"] .rules, .overlay[data-mode="text"] .quick, .overlay:not([data-mode="text"]) p { display: none; }
  .chars { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .chars button { font: inherit; font-size: 15px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chars .lab { align-self: center; color: var(--dim); font-size: 13px; }
  .chars button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .cstat { color: var(--dim); font-size: 13px; min-height: 1.4em; }
  .play { font: inherit; font-weight: 700; font-size: 18px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer; }
  .play:hover { filter: brightness(1.08); }
  /* touch pad (phones) */
  .pad { display: none; justify-content: space-between; align-items: center; gap: 12px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .dpad button, .acts button {
    font: inherit; font-weight: 700; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 18px;
  }
  .dpad button.on, .acts button.on { background: var(--line); }
  .dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; } .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }
  .acts { display: grid; grid-template-columns: 76px 76px; grid-template-rows: 60px 60px; gap: 8px; }
  .acts .hit { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); grid-row: span 2; border-radius: 999px; }
  .acts .jump { grid-row: span 2; border-radius: 999px; }
  @media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } .quick .touch { display: inline; } }
  .help { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--dim); font-size: 14px; line-height: 1.6; }
  kbd { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--text); }
</style>

<div class="wrap">
  <div class="top">
    <h1><span class="roo">Roo</span> <span class="vs">vs</span> <span class="seal">Seal</span></h1>
    <div class="opts">
      <div class="seg" role="group" aria-label="難度">
        <button type="button" id="lv-easy" data-lv="easy" aria-pressed="false">簡單</button>
        <button type="button" id="lv-normal" data-lv="normal" aria-pressed="true">普通</button>
        <button type="button" id="lv-hard" data-lv="hard" aria-pressed="false">困難</button>
      </div>
      <button type="button" class="btn" id="sound" aria-pressed="true">音效：開</button>
      <button type="button" class="btn" id="restart">重選角色</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="袋鼠打海豹網球遊戲畫面"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">袋鼠打海豹</h2>
      <p id="ov-text"></p>
      <div class="chars" id="chars" role="group" aria-label="選角色"></div>
      <div class="chars" id="opps" role="group" aria-label="選對手"></div>
      <div class="cstat" id="cstat"></div>
      <button type="button" class="play" id="ov-btn">開始比賽</button>
      <div class="quick"><span class="keys"><kbd>←→↑↓</kbd> 移動　<kbd>Z</kbd> 打　<kbd>X</kbd> 跳</span><span class="touch">左邊移動，右邊「打」「跳」</span></div>
      <details class="rules">
        <summary>完整玩法</summary>
        <ul>
          <li>跑到地上的<b>黃圈</b>按「打」。提早按＝<b>蓄力</b>（會多耗體力）。</li>
          <li>擊球時按住 <b>↑ 高吊</b>、<b>↓ 小球</b>、<b>←→</b> 方向；邊跑邊打球會拐彎。</li>
          <li>高球會出現紅色<b>扣殺點</b>：站進去，看到「跳！」就跳，空中按「打」＝扣殺。</li>
          <li><b>發球</b>：按一次拋球、最高點再按；按住 ↑ 上旋、↓ 切球。左右區每分輪流。</li>
          <li>集氣滿了，下一球自動<b>必殺</b>；每隻角色還有自己的<b>特技</b>。</li>
          <li><b>體力</b>越少跑越慢，站著會回。P 暫停。</li>
        </ul>
      </details>
    </div>
  </div>

  <div class="pad" aria-label="觸控操作">
    <div class="dpad">
      <button type="button" class="u" data-k="up" aria-label="上">▲</button>
      <button type="button" class="l" data-k="left" aria-label="左">◀</button>
      <button type="button" class="r" data-k="right" aria-label="右">▶</button>
      <button type="button" class="d" data-k="down" aria-label="下">▼</button>
    </div>
    <div class="acts">
      <button type="button" class="hit" data-k="hit">打</button>
      <button type="button" class="jump" data-k="jump">跳</button>
    </div>
  </div>

  <div class="help keys"><kbd>←→↑↓</kbd> 移動　<kbd>Z</kbd> 打（擊球時 ↑ 高吊、↓ 小球）　<kbd>X</kbd> 跳　<kbd>P</kbd> 暫停</div>
</div>

<script>
(() => {
  // ---------- world (metres) and projection: camera behind the kangaroo, court narrows into the distance
  const W = 960, H = 600;
  const L = 23.77, NET_Y = L / 2, NET_H = 0.95, HALF_W = 4.115, DOUBLES_HALF = 5.485, SERVICE = 6.4;
  const G = 12, REACH_Z = 2.5, PERFECT_D = 0.6;   // horizontal reach lives in CHARS
  const CHAR = 0.7;                      // character draw scale: small players on a big court (hit reach is in world metres, unaffected)
  const SMASH_REACH = 1.4;               // airborne horizontal reach multiplier (overhead swing reaches further)
  // stamina (b.st 0..1): moving drains, standing recovers, charging drains extra (the price of holding a charge);
  // speed x (ST_MIN + ST_SPAN * st): fresh legs run 10% faster than base, empty legs 35% slower
  const ST_MIN = 0.65, ST_SPAN = 0.45, ST_RUN = 0.09, ST_CHARGE = 0.22, ST_REST = 0.22, ST_JUMP = 0.1, ST_DIVE = 0.12, ST_POINT = 0.2;
  const TOSS_V = 6, APEX_OK = 0.08;     // serve toss speed; perfect-serve window (s) around the toss apex
  const K = 78, Y0 = -3.2, YSPAN = L + 6.4, SCR_NEAR = 592, SCR_FAR = 152, FAR_SHRINK = 0.45;
  const LEVELS = {
    easy:   { speed: 4.2, miss: 0.22, err: 1.4, meter: 0.1 },
    normal: { speed: 5.2, miss: 0.1,  err: 0.8, meter: 0.13 },
    hard:   { speed: 6.2, miss: 0.03, err: 0.35, meter: 0.16 },
  };
  const POINT_NAMES = ["0", "15", "30", "40"], GAMES_TO_WIN = 3;
  // playable characters: trait (signature move, see TRAITS below), stDrain (stamina use x), speed (m/s), jump (take-off m/s), reach / dive (m), power (shot speed x), meter (charge gain x),
  // sp = special shot: name, speed, rgb (trail/glow), fx (flight twist in stepBall), hurt (receiver's line); draw = body painter
  const CHARS = {
    roo:     { name: "袋鼠", speed: 6.4, jump: 5.4, reach: 1.5, dive: 3.0, power: 1.0,  meter: 1.0, band: "#f6c453", tag: "平衡型",
               sp: { name: "迴力鏢火球！", speed: 30, rgb: "255,150,50", fx: "curve", hurt: "好燙！" }, trait: "dj", tdesc: "二段跳：空中再按一次跳", stDrain: 1.0,
               draw: (c) => bodyRoo(c) },
    rabbit:  { name: "兔子", speed: 6.8, jump: 6.4, reach: 1.3, dive: 3.0, power: 0.92, meter: 1.0, band: "#ff8fb8", tag: "跳最高、手短",
               sp: { name: "月亮跳跳球！", speed: 24, rgb: "255,150,200", fx: "hop", hurt: "彈去哪了！" }, trait: "hi", tdesc: "跳最高，扣殺王", stDrain: 1.0,
               draw: (c) => bodyRabbit(c) },
    penguin: { name: "企鵝", speed: 5.5, jump: 4.2, reach: 1.7, dive: 3.8, power: 1.15, meter: 1.0, band: "#7fe0ff", tag: "慢但手長力大、飛撲遠",
               sp: { name: "冰山滑球！", speed: 26, rgb: "170,230,255", fx: "wobble", hurt: "好滑！" }, trait: "slide", tdesc: "肚子滑行：飛撲滑很遠、馬上爬起來", stDrain: 1.0,
               draw: (c) => bodyPenguin(c) },
    cheetah: { name: "獵豹", speed: 8.2, jump: 4.8, reach: 1.4, dive: 3.2, power: 0.95, meter: 1.0, band: "#ff6a2a", tag: "最快、跳得低",
               sp: { name: "音速球！", speed: 42, rgb: "255,220,110", fx: "none", hurt: "看不見！" }, trait: "burst", tdesc: "爆衝：體力七成以上更快，但很快喘", stDrain: 1.6,
               draw: (c) => bodyCheetah(c) },
    seal:    { name: "海豹", speed: 6.0, jump: 4.4, reach: 1.5, dive: 3.0, power: 1.0,  meter: 1.0, band: "#7fe0ff", tag: "肚子滑行、冰旋球會凍住對手",
               sp: { name: "冰旋球！", speed: 17, rgb: "150,230,255", fx: "wobble", hurt: "凍、凍住了", freeze: true }, trait: "nose", tdesc: "鼻子頂球：每分一次自動救球", stDrain: 1.0,
               draw: (c, b) => bodySeal(c, b) },
    bear:    { name: "北極熊", speed: 5.4, jump: 4.0, reach: 1.75, dive: 2.8, power: 1.25, meter: 1.0, band: "#5aa9ff", tag: "最慢但力量最大、手最長",
               sp: { name: "冰原重砲！", speed: 36, rgb: "200,235,255", fx: "none", hurt: "好、好重…", stun: 1.3 }, trait: "heavy", tdesc: "重砲：蓄滿 MAX 的球接到會被震暈；體力耗一半", stDrain: 0.5,
               draw: (c) => bodyBear(c) },
    hulk:    { name: "綠巨人", speed: 5.8, jump: 4.6, reach: 1.6, dive: 3.0, power: 1.2, meter: 1.0, band: "#3fa34d", tag: "力量大、速度慢",
               sp: { name: "巨人震地砲！", speed: 34, rgb: "120,230,110", fx: "none", hurt: "地、地震了！", stun: 1.2 },
               trait: "rage", tdesc: "暴怒：連丟 2 分後變身，下一球超強重擊", stDrain: 0.8,
               look: { head: "hulk", skin: "#6cbf4a", shirt: "#f4f4f2", shorts: "#1f2126", band: "#d8323c" }, draw: (c, b) => bodyHuman(c, b) },
    cap:     { name: "帽子哥", speed: 6.6, jump: 5.2, reach: 1.45, dive: 3.0, power: 1.0, meter: 1.1, band: "#2d3340", tag: "均衡型",
               sp: { name: "公仔旋風球！", speed: 30, rgb: "255,210,150", fx: "curve", hurt: "被轉暈了…" },
               trait: "precise", tdesc: "精準：完美擊球的範圍比別人大", stDrain: 1.0,
               look: { head: "cap", skin: "#c98f63", shirt: "#ece3d2", shorts: "#3a4152", band: "#2d3340" }, draw: (c, b) => bodyHuman(c, b) },
    zap:     { name: "電電鼠", speed: 7.0, jump: 5.4, reach: 1.3, dive: 3.0, power: 0.95, meter: 1.35, band: "#e8483b", tag: "快、集氣快、手短",
               sp: { name: "電電衝擊！", speed: 30, rgb: "255,240,90", fx: "zigzag", hurt: "麻、麻痺了…", stun: 1.4 }, trait: "static", tdesc: "靜電：完美擊球會電麻對手", stDrain: 1.0,
               draw: (c) => bodyZap(c) },
  };
  // taunts: each character's own win/lose lines, mixed with lines for what just happened (ev)
  const LINES = {
    roo: [["袋鼠拳擊式勝利！", "跳跳跳～"], ["袋袋不服", "我要回澳洲"]],
    rabbit: [["胡蘿蔔是我的！", "兔子跳～"], ["耳朵擋到視線了", "我要去挖洞"]],
    penguin: [["冰上王者！", "企鵝不會飛但會贏"], ["腳太短了啦", "好冷…心更冷"]],
    cheetah: [["太慢了！", "你看得到我嗎？"], ["我只是在暖身", "剛剛不算！"]],
    seal: [["嗷嗷！拍拍拍！", "嗷嗚～"], ["嗷…", "我要回海裡"]],
    bear: [["熊抱慶祝！", "北極熊最強"], ["冰山在融化…", "我只是餓了"]],
    hulk: [["吼——！", "綠巨人最強！"], ["我、我要變身了…", "不要惹我生氣"]],
    cap: [["帽子戴好，球就好", "公仔也會贏"], ["帽子歪了啦", "我只是個公仔…"]],
    zap: [["電電電！", "電到你了吧"], ["電…電…", "沒電了"]],
  };
  const EV_LINES = {                                                     // [winner lines, loser lines]
    net: [["謝謝網子～", "網子站我這邊"], ["網子好愛我…", "這網有毒"]],
    out: [["出界囉～", "眼睛放亮點"], ["那是界內吧？！", "線審你過來"]],
    miss: [["追不到吧～", "腿不夠長喔"], ["等等我！", "剛剛誰按暫停"]],
    smashed: [["扣爆！", "殺！"], ["我的臉…", "剛剛那是什麼"]],
    whiff: [["揮空了哈哈", "空氣好打嗎？"], ["揮、揮空…", "拍子有洞"]],
  };
  let charId = "roo";
  try { const c = localStorage.getItem("roo-seal-char"); if (c && CHARS[c]) charId = c; } catch (e) {}
  // opponent: oppPick is the menu choice ("random" or an id); oppId is resolved per match. The AI still drives the `seal` body.
  let oppPick = "seal", oppId = "seal";
  try { const c = localStorage.getItem("roo-seal-opp"); if (c && (c === "random" || CHARS[c])) oppPick = c; } catch (e) {}
  const resolveOpp = () => { const ids = Object.keys(CHARS).filter((id) => id !== charId); oppId = oppPick === "random" ? pick(ids) : oppPick; };
  const me = () => CHARS[charId], opp = () => CHARS[oppId];
  const charOf = (side) => side === 0 ? me() : opp();
  const nameOf = (side) => charOf(side).name;
  function P(x, y, z = 0) {
    const t = (y - Y0) / YSPAN, s = Math.max(0.05, 1 - FAR_SHRINK * t);   // floor: far-away objects must not get a negative size (canvas throws)
    return { x: W / 2 + x * K * s, y: SCR_NEAR - t * (SCR_NEAR - SCR_FAR) - z * K * s, s };
  }

  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay"), ovTitle = document.getElementById("ov-title"),
        ovText = document.getElementById("ov-text"), ovBtn = document.getElementById("ov-btn");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let level = "normal";
  try { const s = localStorage.getItem("roo-seal-level"); if (s && LEVELS[s]) level = s; } catch (e) {}
  let soundOn = true;

  // ---------- state
  const makeBody = (side) => ({ side, x: 0, y: 0, vx: 0, vy: 0, face: 1, swing: 0, swingT: 0, swingCd: 0, shot: "drive",
    meter: 0, armed: false, stun: 0, frozen: 0, bubble: "", bubbleT: 9, clap: 0, hop: 0, willMiss: false,
    charging: false, chargeT: 0, diveT: 0, diveVx: 0, diveVy: 0, recover: 0, slide: 0, z: 0, vz: 0, swingAgo: 9, spinT: 0, netFace: 0, st: 1, panted: false, dj: false, noseUsed: false, rage: false, lostRow: 0 });
  const roo = makeBody(0), seal = makeBody(1);
  const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, live: false, kind: "normal", t: 0, curve: 0, trail: [], netted: false, squash: 0, power: 0 };
  const rings = [];                      // impact shockwaves (screen space)
  const score = { pts: [0, 0], games: [0, 0], server: 0 };
  let phase = "intro", pausedFrom = "serve";
  let lastHitter = 0, bounces = 0, rally = 0, bestRally = 0, msg = "", msgT = 9, serveT = 0, tossT = -1, shake = 0, freeze = 0, flash = 0;
  const keys = { left: false, right: false, up: false, down: false };
  const particles = [];

  const say = (b, t) => { b.bubble = t; b.bubbleT = 0; };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- sound
  let actx = null;
  function beep(freq, dur, type = "triangle", vol = 0.18, slide = 0) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(actx.destination); o.start(); o.stop(t + dur);
    } catch (e) {}
  }

  // heavy racket hit: noise crack + low thump, both scaled by power (0..1)
  let noiseBuf = null;
  function thwack(power) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }

  const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down" };
  addEventListener("keydown", (e) => {
    if (KEYMAP[e.code]) {
      keys[KEYMAP[e.code]] = true; e.preventDefault();
      const k = KEYMAP[e.code], menu = !e.repeat && (phase === "intro" || phase === "over") && !overlay.hidden;
      const cyc = (ids, cur, d) => ids[(ids.indexOf(cur) + d + ids.length) % ids.length];
      if (menu && (k === "left" || k === "right")) setChar(cyc(Object.keys(CHARS), charId, k === "left" ? -1 : 1));
      if (menu && (k === "up" || k === "down")) setOpp(cyc(OPP_IDS, oppPick, k === "up" ? -1 : 1));
      return;
    }
    if (e.repeat) return;
    if (e.code === "KeyZ" || e.code === "Space" || e.code === "KeyJ") { e.preventDefault(); swing(); }
    else if (e.code === "KeyX" || e.code === "KeyK") { e.preventDefault(); jump(); }
    else if (e.code === "KeyP" || e.code === "Escape") togglePause();
    else if (e.code === "Enter" && (phase === "intro" || phase === "over")) startMatch();
  });
  addEventListener("keyup", (e) => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
  document.querySelectorAll(".pad button").forEach((b) => {
    const k = b.dataset.k;
    const on = (e) => { e.preventDefault(); b.classList.add("on"); if (k in keys) keys[k] = true; else if (k === "jump") jump(); else swing(); };
    const off = () => { b.classList.remove("on"); if (k in keys) keys[k] = false; };
    b.addEventListener("pointerdown", on); ["pointerup", "pointercancel", "pointerleave"].forEach((t) => b.addEventListener(t, off));
  });

  const charsEl = document.getElementById("chars"), oppsEl = document.getElementById("opps"), cstat = document.getElementById("cstat");
  const OPP_IDS = [...Object.keys(CHARS), "random"];
  function row(el, label, ids, cur, onPick) {
    el.innerHTML = `<span class="lab">${label}</span>`;
    for (const id of ids) {
      const bt = document.createElement("button"); bt.type = "button"; bt.textContent = id === "random" ? "隨機" : CHARS[id].name;
      bt.setAttribute("aria-pressed", id === cur); bt.addEventListener("click", () => onPick(id)); el.appendChild(bt);
    }
  }
  function renderChars() {
    row(charsEl, "自己", Object.keys(CHARS), charId, setChar);
    row(oppsEl, "對手", OPP_IDS, oppPick, setOpp);
    const c = me(); cstat.textContent = `${c.tdesc}｜必殺：${c.sp.name.replace("！", "")}`;
  }
  function setChar(id) { charId = id; try { localStorage.setItem("roo-seal-char", id); } catch (e) {} renderChars(); }
  function setOpp(id) { oppPick = id; if (id !== "random") oppId = id; try { localStorage.setItem("roo-seal-opp", id); } catch (e) {} renderChars(); }
  function showOverlay(title, text, btn) { ovTitle.textContent = title; ovText.textContent = text; overlay.dataset.mode = "text"; ovBtn.textContent = btn; overlay.hidden = false; charsEl.hidden = oppsEl.hidden = cstat.hidden = phase === "paused"; }
  function startMatch() {
    score.pts = [0, 0]; score.games = [0, 0]; score.server = 0; msg = ""; overlay.hidden = true; bestRally = 0; resolveOpp();
    for (const b of [roo, seal]) { b.meter = 0; b.armed = false; b.bubble = ""; b.st = 1; b.rage = false; b.lostRow = 0; }
    particles.length = 0; startServe();
  }
  function togglePause() {
    if (phase === "paused") { phase = pausedFrom; overlay.hidden = true; }
    else if (phase === "serve" || phase === "rally" || phase === "point") { pausedFrom = phase; phase = "paused"; showOverlay("暫停中", "按 P 或下方按鈕繼續。", "繼續"); }
  }
  ovBtn.addEventListener("click", () => { if (phase === "paused") togglePause(); else startMatch(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && (phase === "serve" || phase === "rally" || phase === "point")) togglePause(); });
  // back to the character menu (the intro overlay); the match restarts from "開始比賽"
  function showMenu() {
    phase = "intro"; ball.live = false; msg = ""; placeForServe();
    ovTitle.textContent = "袋鼠打海豹"; ovBtn.textContent = "開始比賽"; delete overlay.dataset.mode;
    charsEl.hidden = oppsEl.hidden = cstat.hidden = false; overlay.hidden = false;
  }
  document.getElementById("restart").addEventListener("click", (e) => { e.currentTarget.blur(); showMenu(); });
  const sBtn = document.getElementById("sound");
  sBtn.addEventListener("click", () => { soundOn = !soundOn; sBtn.textContent = soundOn ? "音效：開" : "音效：關"; sBtn.setAttribute("aria-pressed", soundOn); sBtn.blur(); });
  document.querySelectorAll(".seg button").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.lv === level);
    b.addEventListener("click", () => {
      level = b.dataset.lv; try { localStorage.setItem("roo-seal-level", level); } catch (e) {}
      document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b)); b.blur();
    });
  });

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1), rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr); canvas.height = Math.round(rect.height * dpr);
  }
  new ResizeObserver(resize).observe(canvas); resize();
  if (location.hash === "#test") window.__g = { roo, seal, ball, keys, score, awardPoint, startMatch, smashSpot, swing, jump, hitBall, me, opp, predict, serveCourt, get phase() { return phase; }, set phase(v) { phase = v; }, set lastHitter(v) { lastHitter = v; }, get lastHitter() { return lastHitter; }, get bounces() { return bounces; }, get msg() { return msg; }, set msg(v) { msg = v; } };
  if (oppPick !== "random") oppId = oppPick;
  renderChars(); placeForServe();
  requestAnimationFrame(frame);
})();
